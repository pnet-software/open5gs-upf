# open5gs-upf pipeline:
#
# - Pull requests and pushes to main run helm-lint.
# - A tag vX.Y.Z (e.g. v1.0.0) also publishes the chart to Docker Hub (namespace vars.DOCKERHUB_NAMESPACE):
#     oci://registry-1.docker.io/<namespace>/open5gs-upf   1.0.0
#   and creates the GitHub Release v1.0.0 with generated notes.
#
# Only the chart's version comes from the tag. Its appVersion stays the Open5GS version, and the image is
# gradiant/open5gs at values.yaml's image.tag: this repository publishes no image of its own.
# The Bitnami common chart is vendored in charts/, so nothing is pulled at build time.
# Needs the organization secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, and the variable DOCKERHUB_NAMESPACE.
name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CHART_DIR: .
  HELM_VERSION: v3.17.3

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint and template
        run: |
          set -euo pipefail
          helm lint "$CHART_DIR"
          # Defaults: the SMF list renders a PFCP client block, the advertise address the GTP-U Service name
          out=$(helm template ci "$CHART_DIR")
          grep -q 'address: "open5gs-em-stack-smf-pfcp.open5gs-em-stack.svc"' <<<"$out"
          grep -q 'advertise: "ci-open5gs-upf-gtpu"' <<<"$out"
          # No SMF: the block is left out, as upstream
          helm template ci "$CHART_DIR" --set config.upf.pfcp.smf=null > /dev/null

  helm-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: helm-lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Package and push the chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          helm package "$CHART_DIR" --version "$VERSION" --destination dist
          helm push dist/*.tgz "oci://registry-1.docker.io/$NAMESPACE"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
